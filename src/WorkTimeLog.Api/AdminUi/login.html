<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d6efd">
  <meta name="robots" content="noindex, nofollow">
  <title>เข้าสู่ระบบแอดมิน — บันทึกเวลาปฏิบัติงาน</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .login-wrap { min-height: 100vh; min-height: 100dvh; }
    .login-card { max-width: 420px; }
  </style>
</head>
<body>
  <main class="login-wrap d-flex align-items-center justify-content-center px-3 py-4">
    <div class="card shadow-sm login-card w-100">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <div class="display-6 text-primary"><i class="bi bi-shield-lock"></i></div>
          <h1 class="h4 fw-bold mb-1">เข้าสู่ระบบแอดมิน</h1>
          <p class="text-body-secondary small mb-0">สำหรับดูฐานข้อมูลระบบบันทึกเวลาปฏิบัติงาน</p>
        </div>

        <div id="loginError" class="alert alert-danger d-none py-2" role="alert" aria-live="assertive"></div>

        <form id="loginForm" novalidate>
          <label for="password" class="form-label">รหัสผ่าน</label>
          <div class="input-group mb-3">
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required autofocus>
            <button class="btn btn-outline-secondary" type="button" id="togglePw" aria-label="แสดง/ซ่อนรหัสผ่าน">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary" id="loginBtn">
              <span class="spinner-border spinner-border-sm me-1 d-none" id="spin" aria-hidden="true"></span>
              <i class="bi bi-box-arrow-in-right me-1"></i>เข้าสู่ระบบ
            </button>
          </div>
        </form>

        <p class="small text-body-secondary mt-3 mb-0">
          <i class="bi bi-info-circle me-1"></i>ใส่รหัสผิดได้ไม่เกิน 5 ครั้งใน 15 นาที · เข้าสู่ระบบแล้วอยู่ได้ 8 ชั่วโมง
        </p>
        <hr>
        <div class="text-center"><a href="/" class="small"><i class="bi bi-arrow-left me-1"></i>กลับหน้าบันทึกเวลา</a></div>
      </div>
    </div>
  </main>
  <script src="/admin/assets/login.js"></script>
</body>
</html>
