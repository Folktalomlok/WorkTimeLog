# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: worktimelog
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/projects
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DB_PATH
        value: /app/data/worklog.db
      # PORT ไม่ต้องตั้ง — Render กำหนดให้เอง (ค่าเริ่มต้น 10000)
